# fly.toml app configuration file generated for randos on 2026-05-24T22:22:00Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'randos'
kill_signal = 'SIGTERM'
primary_region = 'ord'

[env]
  PHX_HOST = 'randos.fly.dev'
  PORT = '8080'
  # The status page's daily counters (aggregate counts only), on the volume
  # below, so they survive the machine sleeping and deploys.
  RANDOS_STATS_DIR = '/data/stats'

# A 1 GB volume (about $0.15/month) for those counters. One per machine:
# with more machines, each keeps its own, and /status sums them.
[mounts]
  source = 'randos_data'
  destination = '/data'

[http_service]
  auto_start_machines = true
  auto_stop_machines = true
  concurrency = { hard_limit = 1000, soft_limit = 1000, type = 'connections' }
  force_https = true
  internal_port = 8080
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '512mb'
  memory_mb = 512
  size = 'shared-cpu-1x'
