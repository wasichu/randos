# TUI releases (Phase 4.4): on a version tag (v0.1.0, …), build the installable
# archive on each v1 target with `just tui-release` (which also runs the
# unpacked copy), then attach them, with their SHA-256 sums, to a GitHub
# release for the tag. Run it by hand (workflow_dispatch) to build the
# archives as artifacts without releasing anything.
#
# Homebrew (Phase 4.5) installs these archives; updating the tap's formula is
# a separate, manual step for now (see packaging/homebrew/README.md).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: ALSA headers (cpal on Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: jdx/mise-action@v5
        with:
          install_args: erlang elixir just rust cmake

      - uses: Swatinem/rust-cache@v2

      - name: Hex
        run: mix local.hex --force --if-missing

      # The tag and the app's version must agree, or the archive's name lies.
      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n 's/^ *version: "\(.*\)",$/\1/p' clients/tui/mix.exs | head -1)"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but mix.exs says ${version}"; exit 1; }

      - run: just tui-release

      - uses: actions/upload-artifact@v7
        with:
          name: randos-${{ matrix.os }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create the release with the archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.sha256 \
            --repo "${GITHUB_REPOSITORY}" \
            --title "randos ${GITHUB_REF_NAME}" \
            --notes "The randos terminal client. Unpack and run bin/randos, or install with Homebrew. Checksums are in the .sha256 files."
