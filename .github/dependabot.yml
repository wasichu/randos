# Dependency update PRs (GitHub's own Dependabot; nothing outside GitHub
# sees the code). Grouped, one PR per ecosystem and directory, so updates
# arrive as a few reviewable PRs that CI checks like any other. Security
# advisories still come one at a time, as soon as GitHub knows of them
# (repository settings: Dependabot security updates).
version: 2
updates:
  - package-ecosystem: mix
    directory: /
    schedule: {interval: weekly, day: monday}
    labels: ["dependencies"]
    groups: {mix: {patterns: ["*"]}}
  - package-ecosystem: mix
    directory: /clients/tui
    schedule: {interval: weekly, day: monday}
    labels: ["dependencies"]
    groups: {tui-mix: {patterns: ["*"]}}
  # The workspace: the TUI's media helper and the voice crate. Vendored
  # crates (vendor/) are patched copies, updated by hand (vendor/README.md).
  - package-ecosystem: cargo
    directory: /
    schedule: {interval: weekly, day: monday}
    labels: ["dependencies"]
    groups: {cargo: {patterns: ["*"]}}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly, day: monday}
    labels: ["dependencies"]
    groups: {actions: {patterns: ["*"]}}
  # The Python harnesses, monthly, labelled gpu-check: a model library's
  # update (torch, transformers, ...) needs the GPU comparison before merging
  # (docs/development.md, "Dependency updates"). Their tooling (pytest,
  # ruff, setuptools) comes in a group of its own: CI is enough for that one.
  - package-ecosystem: uv
    directory: /tools/translate
    schedule: {interval: monthly}
    labels: ["dependencies", "gpu-check"]
    groups:
      translate-tooling: {patterns: ["pytest", "ruff", "setuptools"]}
      translate-models: {patterns: ["*"], exclude-patterns: ["pytest", "ruff", "setuptools"]}
  - package-ecosystem: uv
    directory: /tools/voice-eval
    schedule: {interval: monthly}
    labels: ["dependencies", "gpu-check"]
    groups:
      voice-eval-tooling: {patterns: ["pytest", "ruff", "setuptools"]}
      voice-eval-models: {patterns: ["*"], exclude-patterns: ["pytest", "ruff", "setuptools"]}
