[project]
name = "randos-translate"
version = "0.1.0"
description = "The Phase 6 translation shootout for randos: machine-translate the UI's gettext strings, check and score them, and fill the .po files."
requires-python = "==3.13.*"
# The checks and the .po handling: small, pure Python, no models. Each model
# group brings huggingface_hub (downloads, and its `hf` CLI for the gated
# models: `uv run --group models hf auth login`) at the version its
# transformers needs.
dependencies = [
    "polib==1.2.0",
    "sacrebleu==2.5.1",
]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.12.12"]
# Running models (`uv sync --group models`): Opus-MT, M2M100, MADLAD-400 and
# the MetricX-24 scorer, through transformers on Apple's GPU (MPS).
models = [
    "torch==2.8.0",
    "transformers==4.56.2",
    "sentencepiece==0.2.1",
    "sacremoses==0.1.1",
]
# The MLX models (`--group mlx`): Hy-MT2, TranslateGemma, and the tone
# judges (Mistral Small 3.2, Qwen3 30B-A3B), through mlx-lm on Apple's GPU.
mlx = ["mlx-lm==0.32.2"]
# The COMET-Kiwi scorer (`--group comet`): Unbabel's package and its own
# PyTorch Lightning stack, kept apart from the rest.
comet = ["unbabel-comet==2.2.7", "setuptools==80.9.0"]

[tool.uv]
package = false
# mlx-lm needs transformers 5; the seq2seq models and COMET stay on 4.x, so
# the groups resolve apart (one group per `uv run`, which is how runs go anyway).
conflicts = [
    [{ group = "mlx" }, { group = "models" }],
    [{ group = "mlx" }, { group = "comet" }],
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
