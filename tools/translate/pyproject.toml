[project]
name = "randos-translate"
version = "0.1.0"
description = "The Phase 6 translation shootout for randos: machine-translate the UI's gettext strings, check and score them, and fill the .po files."
requires-python = "==3.13.*"
# The checks and the .po handling: small, pure Python, no models; and
# huggingface_hub for its `hf` CLI (`uv run hf auth login`, for the gated
# models) and model downloads.
dependencies = [
    "huggingface-hub==0.36.2",
    "polib==1.2.0",
    "sacrebleu==2.5.1",
]

[dependency-groups]
dev = ["pytest==8.4.2"]
# Running models (`uv sync --group models`): Opus-MT, M2M100, MADLAD-400
# through transformers on Apple's GPU (MPS). The MLX models (Hy-MT2,
# TranslateGemma) and the scorers (MetricX, COMET-Kiwi) get their own groups
# when the full shootout runs (see README.md).
models = [
    "torch==2.8.0",
    "transformers==4.56.2",
    "sentencepiece==0.2.1",
    "sacremoses==0.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
