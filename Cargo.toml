# Cargo workspace for the repo's Rust code (so rust-analyzer and cargo find it
# from the repo root): the TUI's media helper (clients/tui/native/README.md)
# and the Rust voice processors (voice/README.md), plus the isolated native
# Signalsmith boundary (voice-native/README.md; browser core is separate WASM).
[workspace]
members = ["clients/tui/native", "voice", "voice-native"]
exclude = ["vendor/ex_ratatui/native/ex_ratatui"]
resolver = "3"

# One set of lints for all our Rust (each crate's `[lints] workspace = true`):
# the helper runs the voice crate in its own process, so a rule that guards
# one guards both. A panic kills the user's call (or silences the browser's
# worklet), so nothing that can panic; stdout is the helper's Port, so no
# printing (diagnostics go to stderr; tests and examples may allow it).
[workspace.lints.rust]
# The helper forbids it outright (#![forbid] in main.rs); the voice crate
# has one documented exception (`#[unsafe(no_mangle)]` on its WASM exports).
# voice-native/src/ffi.rs separately isolates C++ ownership/FFI; all other files
# still deny unsafe code, and the helper retains its crate-level forbid.
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
print_stdout = "deny"

[profile.release]
lto = true
codegen-units = 1

# Patched copies of dependencies (vendor/README.md says why, and when to drop them).
[patch.crates-io]
is = { path = "vendor/is" }
