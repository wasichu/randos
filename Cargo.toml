# Cargo workspace for the repo's Rust code (so rust-analyzer and cargo find it
# from the repo root): the TUI's media helper (clients/tui/native/README.md)
# and the voice processors it shares with the browser (voice/README.md).
[workspace]
members = ["clients/tui/native", "voice"]
resolver = "3"

[profile.release]
lto = true
codegen-units = 1

# Patched copies of dependencies (vendor/README.md says why, and when to drop them).
[patch.crates-io]
is = { path = "vendor/is" }
