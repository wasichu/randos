[package]
name = "randos_media"
version = "0.1.0"
edition = "2024"
description = "Media helper for the randos TUI: WebRTC, Opus, mic/speaker. Runs as an Erlang Port."
license = "AGPL-3.0-or-later"
publish = false

# Every dependency is justified in clients/tui/native/README.md (AGENTS.md rule).
[dependencies]
cpal = "0.18"
hound = "3.5"
opus = "0.4"
realfft = "3.5"
ringbuf = "0.5"
rubato = "5"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sonora = "0.2"
str0m = { version = "0.24", default-features = false, features = ["rust-crypto"] }
stun-types = "2.0"
turn-client-proto = "0.7"
turn-client-rustls = { version = "0.1", default-features = false }
webpki-roots = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# A panic kills the call: errors go back over the Port as messages instead.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny" # stdout is the Port; write frames, never print

[dev-dependencies]
turn-server-proto = "0.7"
