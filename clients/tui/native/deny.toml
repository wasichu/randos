# cargo deny check: advisories, licenses, duplicate crates, sources.
[advisories]
yanked = "deny"

[licenses]
# Permissive only: no GPL/LGPL in a binary we redistribute.
# CDLA-Permissive-2.0: webpki-roots, Mozilla's root certificate list (a
# permissive data license), for TURN over TLS.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "CDLA-Permissive-2.0", "ISC", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
