# cargo deny check: advisories, licenses, duplicate crates, sources.
[advisories]
yanked = "deny"

[licenses]
# Dependencies: permissive only (no GPL/LGPL from others in what we ship).
# CDLA-Permissive-2.0: webpki-roots, Mozilla's root certificate list (a
# permissive data license), for TURN over TLS.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "CDLA-Permissive-2.0", "ISC", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9
unused-allowed-license = "allow"

# randos itself is AGPL-3.0-or-later; the allow-list above is for what it
# depends on (permissive only), not for our own unpublished crate.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
