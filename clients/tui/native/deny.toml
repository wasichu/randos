# cargo deny check: advisories, licenses, duplicate crates, sources.
[advisories]
yanked = "deny"

[licenses]
# Permissive only: no GPL/LGPL in a binary we redistribute.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
