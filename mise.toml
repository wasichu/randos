# Toolchain pins for this repo. `mise install` provisions everything;
# commands live in the Justfile (`just --list`).
[tools]
erlang = "29.1.1"
elixir = "1.20.4-otp-29"
just = "1.59.0"
# Node runs the browser smoke test (test/e2e/call_smoke.mjs, `just smoke`);
# it needs >= 22 for the built-in WebSocket/fetch. No npm packages.
node = "26.10.0"
# Infra as code for the coturn server (infra/coturn); state is encrypted and
# committed (see infra/coturn/README.md).
opentofu = "1.13.1"
# Elixir language server: gives Claude Code (via the expert-lsp plugin in
# tools/claude-plugins) compiler diagnostics after edits and symbol navigation.
expert = "0.1.11"
# Rust: builds the TUI's media helper (clients/tui/native). Build-time only;
# users get prebuilt binaries (Phase 4.4).
rust = { version = "1.99.1", components = "rustfmt,clippy,rust-analyzer", targets = "wasm32-unknown-unknown" }
# Builds libopus from source for the helper's `opus` crate (build-time only).
cmake = "4.4.4"
# Dependency advisories, license policy, and duplicate checks for the helper.
cargo-deny = "0.20.2"
"github:tidewave-ai/mcp_proxy_rust" = "0.2.3"
# Local HTTPS certificates for the dev server (`just certs`), so another
# device on the network gets a secure context (browsers allow the mic only
# on localhost or HTTPS).
mkcert = "1.4.4"
